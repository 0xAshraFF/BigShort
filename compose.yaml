services:
  paper:
    build: .
    restart: unless-stopped
    volumes:
      - paper-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  paper-data:
