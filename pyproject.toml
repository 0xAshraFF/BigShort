[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigshort"
version = "0.1.0"
description = "Deterministic Binance futures paper-trading research agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bigshort = "bigshort.cli:main"

[tool.setuptools.packages.find]
include = ["bigshort*"]
